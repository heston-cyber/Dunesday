.band{fill:var(--band)}

const FILM_KEY = "seats.film";
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

let names = {};
for (const f of FILMS) names[f.id] = {};
let status = SHEET ? "loading" : "none";

const view = document.getElementById("view");

function film(){ return FILMS.find(x => x.id === filmId) || FILMS[0]; }

function orderOf(f, num){ return f.orders.find(o => o.seats.indexOf(num) !== -1) || null; }
function tint(o){ return SHOW_CONF && o ? o.ti : 1; }
function seatInFilm(f, s){ return /^I\d+$/.test(s) && f.seatOrder.indexOf(+s.slice(1)) !== -1; }
function esc(t){ return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]); }
function short(n){ if (!n) return ""; const w = n.trim().split(/\s+/)[0]; return w.length > 10 ? w.slice(0,9) + "\u2026" : w; }
function ariaSeat(s, name){ return "Seat " + s + (name ? ", " + name : ", open"); }

/* ---------- sheet ---------- */

function parseCSV(t){
  const rows = []; let row = [], fld = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') { if (t[i + 1] === '"') { fld += '"'; i++; } else q = false; }
      else fld += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(fld); fld = ""; }
    else if (c === "\n") { row.push(fld); rows.push(row); row = []; fld = ""; }
    else if (c !== "\r") fld += c;
  }
  if (fld !== "" || row.length) { row.push(fld); rows.push(row); }
  return rows;
}

function filmFor(cell){
  const v = cell.trim().toLowerCase();
  if (v.indexOf("dune") !== -1) return FILMS.find(f => f.id === "dune");
  if (v.indexOf("doom") !== -1 || v.indexOf("avengers") !== -1) return FILMS.find(f => f.id === "doom");
  return null;
}

function parseSheet(text){
  const out = {};
  for (const f of FILMS) out[f.id] = {};
  for (const r of parseCSV(text)) {
    if (r.length < 3) continue;
    const f = filmFor(r[0] || "");
    if (!f) continue;
    let seat = String(r[1] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (/^\d+$/.test(seat)) seat = "I" + seat;
    const name = String(r[2] || "").trim().slice(0, 30);
    if (name && seatInFilm(f, seat)) out[f.id][seat] = name;
  }
  return out;
}

async function load(){
  if (!SHEET) return;
  lastLoad = Date.now();
  try {
    let url = SHEET;
    if (!/^https?:/i.test(url)) url += (url.indexOf("?") === -1 ? "?" : "&") + "v=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error("Not CSV");
    names = parseSheet(text);
    status = "ok";
  } catch (e) {
    status = "error";
  }
  render();
}

/* ---------- views ---------- */

function tabsHTML(){
  return '<nav class="tabs" aria-label="Movies"><div class="tabs-in">' + FILMS.map(x =>
    '<button type="button" class="tab' + (x.id === filmId ? ' active' : '') + '" data-act="film" data-film="' + x.id + '" aria-pressed="' + (x.id === filmId) + '">' +
    '<span class="tab-t">' + esc(x.title) + '</span><span class="tab-d">' + esc(x.day) + '</span></button>'
  ).join("") + '</div></nav>';
}

function heroHTML(f){
  return '<header class="hero"><h1 class="title">' + esc(f.title) + '</h1>' +
    '<div class="when"><span>' + esc(f.day) + '</span><span class="time">' + esc(f.time) + '</span></div>' +
    '<p class="sub">' + (f.format ? esc(f.format) + ' at ' : '') + esc(f.theater) + '</p>' +
    (f.note ? '<p class="note">' + esc(f.note) + '</p>' : '') + '</header>';
}

function mapSVG(f){
  const m = f.map, p = m.pitch;
  const w = +(p * 0.74).toFixed(2), h = +(p * 0.62).toFixed(2), rx = +(p * 0.16).toFixed(2);
  const x1 = m.scr[0], x2 = m.scr[1], ye = m.scr[2], yp = m.scr[3];
  const cx = (x1 + x2) / 2, cy = 2 * yp - ye;
  let out = '<svg viewBox="' + m.vb.join(" ") + '" aria-hidden="true" focusable="false">';
  out += '<path class="screen" d="M' + x1 + ' ' + ye + ' Q' + cx + ' ' + cy + ' ' + x2 + ' ' + ye + '"/>';
  out += '<text class="scr-label" x="' + cx + '" y="' + (yp + 44) + '">Screen</text>';
  let k = 0;
  for (const r of m.rows) {
    const xs = r.p ? r.p.slice() : r.s.flatMap(seg => Array.from({ length: seg[1] }, (_, i) => seg[0] + i * p));
    if (r.i) {
      out += '<rect class="band" x="' + m.vb[0] + '" y="' + (r.y - p * 0.66).toFixed(1) + '" width="' + m.vb[2] + '" height="' + (p * 1.32).toFixed(1) + '" rx="' + (p * 0.5).toFixed(1) + '"/>';
      out += '<text class="rowlabel" x="' + (xs[0] - p * 0.9).toFixed(1) + '" y="' + r.y + '">Row I</text>';
    }
    xs.forEach((x, i) => {
      const geo = ' x="' + (x - w / 2).toFixed(1) + '" y="' + (r.y - h / 2).toFixed(1) + '" width="' + w + '" height="' + h + '" rx="' + rx + '"/>';
      if (r.i) {
        const num = m.num === "rtl" ? xs.length - i : i + 1;
        const o = orderOf(f, num);
        if (o) {
          const s = "I" + num;
          out += '<rect class="s m t' + tint(o) + (nm(f, s) ? ' f' : '') + (selected === s ? ' sel' : '') + '" data-act="pick" data-seat="' + s + '" style="--d:' + (k++ * 45) + 'ms"' + geo;
          return;
        }
        out += '<rect class="s r"' + geo;
      } else out += '<rect class="s"' + geo;
    });
  }
  return out + '</svg>';
}

function mapHTML(f){
  return '<section class="card mapcard" aria-label="Auditorium map"><div class="sec-head"><h2>' + esc(f.aud || "The auditorium") + '</h2><p>Our seats are in row I</p></div>' +
    mapSVG(f) +
    '<div class="legend"><span><i class="sw full"></i>Named</span><span><i class="sw open"></i>Still open</span></div></section>';
}

function editorHTML(f){
  if (!selected || !seatInFilm(f, selected)) return '<p class="ed-hint">Tap a seat to see who\u2019s sitting there.</p>';
  const o = orderOf(f, +selected.slice(1)), name = nm(f, selected);
  return '<div class="ed-row t' + tint(o) + '"><span class="ed-seat">' + selected + '</span><span class="ed-name' + (name ? '' : ' open') + '">' + (name ? esc(name) : 'Open seat') + '</span></div>' +
    (SHOW_CONF ? '<p class="ed-meta">On confirmation #' + o.conf + '.</p>' : '');
}

function closeHTML(f){
  let s = '<section class="card close" aria-labelledby="close-h"><div class="sec-head"><h2 id="close-h">Row I up close</h2><p>As you face the screen</p></div><div class="seatrow">';
  if (f.ghostL) s += '<div class="ghost" aria-hidden="true"><span class="back">' + f.ghostL + '</span><span class="who">&nbsp;</span></div>';
  f.seatOrder.forEach((num, i) => {
    const seat = "I" + num, o = orderOf(f, num), name = nm(f, seat);
    s += '<button type="button" class="chair t' + tint(o) + (i % 2 ? ' lo' : '') + (name ? ' filled' : '') + (selected === seat ? ' sel' : '') + '" data-act="pick" data-seat="' + seat + '" aria-label="' + esc(ariaSeat(seat, name)) + '">' +
      '<span class="back">' + num + '</span><span class="who">' + (esc(short(name)) || '\u00b7') + '</span></button>';
  });
  if (f.aisleR) s += '<div class="aisle" aria-hidden="true">Aisle</div>';
  return s + '</div><div id="editor" class="editor">' + editorHTML(f) + '</div></section>';
}

function seatLines(f, seats){
  return '<ul>' + seats.map(num => {
    const seat = "I" + num, name = nm(f, seat);
    return '<li class="seatline' + (selected === seat ? ' sel' : '') + '" data-row="' + seat + '"><span class="sl-num">' + seat + '</span>' +
      '<span class="sl-name' + (name ? '' : ' open') + '">' + (name ? esc(name) : 'Open') + '</span></li>';
  }).join("") + '</ul>';
}

function rosterHTML(f){
  const total = f.seatOrder.length, named = f.seatOrder.filter(n => nm(f, "I" + n)).length;
  let s = '<section class="roster" aria-labelledby="ro-h"><div class="sec-head"><h2 id="ro-h">Who sits where</h2><p>' +
    (status === "loading" ? 'Loading names\u2026' : named + ' of ' + total + ' named') + '</p></div>';
  if (status === "error") s += '<p class="ro-note">The seat list didn\u2019t load. Refresh the page to try again.</p>';
  if (SHOW_CONF) {
    for (const o of f.orders) {
      s += '<div class="order t' + o.ti + '"><div class="order-head">' +
        '<button type="button" class="conf" data-act="copy" data-text="' + o.conf + '" aria-label="Copy confirmation number ' + o.conf + '"><span class="hash">#</span>' + o.conf + '</button>' +
        '<span class="order-meta">' + o.seats.length + (o.seats.length === 1 ? ' ticket' : ' tickets') + (o.bought ? '<br>Bought ' + esc(o.bought) : '') + '</span></div>' +
        seatLines(f, o.seats) + '</div>';
    }
  } else {
    s += '<div class="order t1">' + seatLines(f, f.seatOrder) + '</div>';
  }
  return s + '</section>';
}

function detailsHTML(f){
  const n = f.seatOrder.length, c = f.orders.length;
  return '<section class="details" aria-labelledby="where-h"><h2 id="where-h">Where</h2>' +
    '<p class="venue">' + esc(f.theater) + '</p>' +
    '<p class="addr">' + esc(f.addr1) + '<br>' + esc(f.addr2) + (f.aud ? '<br>' + esc(f.aud) : '') + '</p>' +
    '<div class="links"><a class="lnk" href="' + esc(f.maps) + '" target="_blank" rel="noopener">Directions</a>' +
    '<a class="lnk" href="tel:' + f.phone.replace(/\D/g, "") + '">Call ' + esc(f.phone) + '</a></div>' +
    (SHOW_CONF
      ? '<h2 class="h-tix">Tickets</h2><p class="tix">' + n + ' seats on ' + c + ' confirmations. Tap a confirmation number to copy it. In Fandango you can view or text each ticket, or give the box office a confirmation number to pick up the seats listed under it.</p>'
      : '') +
    '</section>';
}

function listText(f){
  const L = [f.title + (f.format ? " (" + f.format + ")" : ""), f.day + " at " + f.time, f.theater + (f.aud ? ", " + f.aud : ""), f.addr1 + ", " + f.addr2, "", "Row I, left to right as you face the screen:"];
  for (const num of f.seatOrder) { const s = "I" + num; L.push(s + "  " + (nm(f, s) || "open")); }
  return L.join("\n");
}

function shareHTML(f){
  return '<section class="share" aria-labelledby="share-h"><h2 id="share-h">Send the seat list</h2>' +
    '<p>Copies the showtime, the theater, and who\u2019s in each seat, ready to paste into a group text.</p>' +
    '<button type="button" class="btn" data-act="copylist">Copy seat list</button>' +
    '<details class="prev" id="prev"><summary>Preview the text</summary><textarea id="listprev" readonly rows="' + (f.seatOrder.length + 7) + '">' + esc(listText(f)) + '</textarea></details></section>';
}

function render(){
  const f = film();
  const prevOpen = !!(document.getElementById("prev") || {}).open;
  document.documentElement.setAttribute("data-film", f.id);
  tabsEl.innerHTML = tabsHTML();
  view.innerHTML = '<main class="wrap">' + heroHTML(f) +
    '<div class="grid"><div class="col-map">' + mapHTML(f) + closeHTML(f) + '</div>' +
    '<div class="col-info">' + rosterHTML(f) + detailsHTML(f) + shareHTML(f) + '</div></div></main>';
  const d = document.getElementById("prev");
  if (d && prevOpen) d.open = true;
}

/* ---------- interaction ---------- */

let toastTimer = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function legacyCopy(t){
  try {
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch(e){ return false; }
}
async function copy(t){
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch(e){}
  return legacyCopy(t);
}

async function copyList(){
  if (await copy(listText(film()))) { toast("Seat list copied"); return; }
  const d = document.getElementById("prev"), ta = document.getElementById("listprev");
  if (d) d.open = true;
  if (ta) { ta.focus(); ta.select(); }
  toast("Select the text below to copy it");
}

function updateSel(){
  view.querySelectorAll(".sel").forEach(el => el.classList.remove("sel"));
  if (selected) view.querySelectorAll('.chair[data-seat="' + selected + '"], rect[data-seat="' + selected + '"], li[data-row="' + selected + '"]').forEach(el => el.classList.add("sel"));
  const ed = document.getElementById("editor");
  if (ed) ed.innerHTML = editorHTML(film());
}

app.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.getAttribute("data-act");
  if (act === "film") {
    const id = t.getAttribute("data-film");
    if (id === filmId) return;
    filmId = id; selected = null; lsSet(FILM_KEY, id); render();
    try { window.scrollTo(0, 0); } catch(err){}
  } else if (act === "pick") {
    const s = t.getAttribute("data-seat");
    selected = selected === s ? null : s; updateSel();
  } else if (act === "copy") {
    const c = t.getAttribute("data-text");
    toast((await copy(c)) ? "Copied #" + c : "Couldn\u2019t copy. The number is #" + c);
  } else if (act === "copylist") copyList();
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && SHEET && Date.now() - lastLoad > 60000) load();
});

render();
load();
})();
</script>
</body>
</html>
