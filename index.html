:root[data-film="dune"],[data-film="dune"]{--display:"Syncopate","Michroma","Arial Black",sans-serif;--dweight:700;--dcase:uppercase;--dtrack:.08em;--h1:clamp(25px,6.6vw,52px);--h2:16px;--when:clamp(17px,4.4vw,24px);--card-t:17px;--bg:#f2e7d5;--surface:#fbf5ea;--ink:#2a1c10;--muted:#76614c;--line:#dfcdb2;--accent:#a95c18;--on-accent:#fff8ec;--seat:#e2d3bb;--seat-row:#c9b18e;--band:rgba(169,92,24,.12);--screen:#c2a983;--art1:#f3c58c;--art2:#fbe9cf;--art3:#fff3dc;--art4:#e7b47a;--art5:#d2914f;--art6:#a9672f;}
:root[data-film="doom"],[data-film="doom"]{--display:"Cinzel","Trajan Pro",Georgia,serif;--dweight:800;--dcase:none;--dtrack:.015em;--h1:clamp(34px,9vw,68px);--h2:23px;--when:clamp(22px,5.4vw,32px);--card-t:23px;--bg:#e8e7dc;--surface:#f6f5ee;--ink:#122017;--muted:#56645a;--line:#cbcfbf;--accent:#2a6e43;--on-accent:#f6f5ee;--seat:#d4d7c9;--seat-row:#b0b8a1;--band:rgba(42,110,67,.11);--screen:#a3ac96;--art1:#1a241d;--art2:#3f9a62;--art3:#c9a352;--art4:#4a5a4f;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]),:root:not([data-theme="light"])[data-film="classic"],:root:not([data-theme="light"]) [data-film="classic"]{--bg:#121013;--surface:#1c181d;--ink:#f3ece1;--muted:#a2988c;--line:#2d2830;--accent:#f2c14e;--on-accent:#1a1408;--seat:#29242c;--seat-row:#3e3641;--band:rgba(242,193,78,.12);--screen:#4a4250;--art1:#0b090b;--art2:#7a1812;--art3:#f6cf6a;--art4:#3d0b08;}:root:not([data-theme="light"])[data-film="dune"],:root:not([data-theme="light"]) [data-film="dune"]{--bg:#19110b;--surface:#231810;--ink:#f1e3c9;--muted:#a88f74;--line:#3a2a1c;--accent:#eaa543;--on-accent:#1a110a;--seat:#2f2318;--seat-row:#4b3725;--band:rgba(234,165,67,.13);--screen:#5b4430;--art1:#140b07;--art2:#7a3a14;--art3:#f4bd70;--art4:#3e2414;--art5:#2c190e;--art6:#1b110a;}:root:not([data-theme="light"])[data-film="doom"],:root:not([data-theme="light"]) [data-film="doom"]{--bg:#0c130e;--surface:#141f18;--ink:#e8e2ce;--muted:#8f9c8d;--line:#243329;--accent:#d0aa58;--on-accent:#0c130e;--seat:#1b2920;--seat-row:#2d4233;--band:rgba(208,170,88,.12);--screen:#33463a;--art1:#060a07;--art2:#1f8a4a;--art3:#cfa954;--art4:#2b3a30;}}
:root[data-theme="dark"],:root[data-theme="dark"][data-film="classic"],:root[data-theme="dark"] [data-film="classic"]{--bg:#121013;--surface:#1c181d;--ink:#f3ece1;--muted:#a2988c;--line:#2d2830;--accent:#f2c14e;--on-accent:#1a1408;--seat:#29242c;--seat-row:#3e3641;--band:rgba(242,193,78,.12);--screen:#4a4250;--art1:#0b090b;--art2:#7a1812;--art3:#f6cf6a;--art4:#3d0b08;}
:root[data-theme="dark"][data-film="dune"],:root[data-theme="dark"] [data-film="dune"]{--bg:#19110b;--surface:#231810;--ink:#f1e3c9;--muted:#a88f74;--line:#3a2a1c;--accent:#eaa543;--on-accent:#1a110a;--seat:#2f2318;--seat-row:#4b3725;--band:rgba(234,165,67,.13);--screen:#5b4430;--art1:#140b07;--art2:#7a3a14;--art3:#f4bd70;--art4:#3e2414;--art5:#2c190e;--art6:#1b110a;}

:root{
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --side-w:276px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;transition:background-color .35s ease,color .35s ease}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-weight:var(--dweight);text-transform:var(--dcase);letter-spacing:var(--dtrack);font-size:var(--h2);line-height:1.15;margin:0}

/* ---------- shell ---------- */
.side{position:fixed;top:0;bottom:0;left:0;z-index:30;width:min(84vw,var(--side-w));overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .26s ease,background-color .35s ease}
.nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
.scrim{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .26s ease}
.nav-open .scrim{opacity:1;pointer-events:auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line);transition:background-color .35s ease}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:none;cursor:pointer}
.menu-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.top-brand{font-family:var(--display);font-weight:var(--dweight);text-transform:var(--dcase);letter-spacing:var(--dtrack);font-size:20px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[data-film="dune"] .top-brand{font-size:14px}
@media (min-width:960px){
  .side{transform:none;width:var(--side-w);box-shadow:none}
  .scrim,.topbar{display:none}
  .main{margin-left:var(--side-w)}
}

.brand{display:block;font-family:var(--display);font-weight:var(--dweight);text-transform:var(--dcase);letter-spacing:var(--dtrack);font-size:26px;line-height:1.05;text-decoration:none;margin:0 6px 22px}
:root[data-film="dune"] .brand{font-size:17px}
.side-link{display:block;padding:10px 10px;border-radius:10px;text-decoration:none;font-weight:600}
.side-link.active,.side-item.active{background:var(--band)}
.side-label{margin:22px 10px 6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side-empty{margin:4px 10px;color:var(--muted);font-size:14px}
.side-list{list-style:none;margin:0;padding:0}
.side-item{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none}
.side-item:hover,.side-link:hover{background:var(--band)}
.side-item.past{opacity:.6}
.side-dot{flex:0 0 auto;width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.side-txt{min-width:0}
.side-t{display:block;font-weight:600;line-height:1.3}
.side-d{display:block;font-size:13px;color:var(--muted)}
.side-pay{margin-top:26px;border-top:1px solid var(--line);padding-top:4px}
.side-pay p:not(.side-label){margin:4px 10px;font-size:14px;color:var(--muted)}
.handle{background:none;border:0;padding:0;font-weight:600;color:var(--ink);cursor:copy;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* ---------- page ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 72px}
.hero-art{margin:0 -16px;height:clamp(150px,34vw,270px);overflow:hidden;position:relative}
.hero-art::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(to bottom,transparent,var(--bg))}
.art{display:block;width:100%;height:100%}
@media (min-width:960px){ .hero-art{margin:0;border-radius:0 0 18px 18px} }
.title{font-family:var(--display);font-weight:var(--dweight);text-transform:var(--dcase);letter-spacing:var(--dtrack);font-size:var(--h1);line-height:.98;margin:6px 0 0;overflow-wrap:anywhere}
.crumb{display:inline-block;margin-top:16px;font-size:14px;color:var(--muted);text-decoration:none}
.crumb:hover{color:var(--ink)}
.mhero{padding-bottom:6px}
.when{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin-top:14px;font-family:var(--display);font-weight:var(--dweight);text-transform:var(--dcase);letter-spacing:var(--dtrack);font-size:var(--when);line-height:1.1}
.when .time{color:var(--accent)}
.sub{margin:12px 0 0;font-size:17px}
.note{margin:2px 0 0;color:var(--muted);font-size:14px}

.home-hero .title{margin-top:-8px;position:relative}
.lede{margin:12px 0 0;font-size:18px;max-width:46ch;color:var(--muted)}
.home-sec{margin-top:40px}
.home-sec h2{margin-bottom:14px}
.empty{color:var(--muted)}
.cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.mcard{display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}
.mcard:hover{transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(0,0,0,.5)}
.mcard.past{opacity:.7}
.mcard-art{height:120px}
.mcard-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.mcard-t{margin:0;font-family:var(--display);font-weight:var(--dweight);text-transform:var(--dcase);letter-spacing:var(--dtrack);font-size:var(--card-t);line-height:1.15}
.mcard-when{margin:4px 0 0;display:flex;gap:12px;font-weight:600}
.mcard-when span:last-child{color:var(--accent)}
.mcard-where{margin:0;color:var(--muted);font-size:14px}
.mcard-foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;border-top:1px solid var(--line)}
.mcard-price{font-weight:600}

.grid{margin-top:20px}
.col-b{margin-top:22px}
@media (min-width:1100px){
  .grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.9fr);gap:36px;align-items:start}
  .col-b{margin-top:0}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 14px 14px;transition:background-color .35s ease}
.card + .card{margin-top:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head p{margin:0;color:var(--muted);font-size:14px}

/* ---------- map ---------- */
.mapcard svg{display:block;width:100%;height:auto;max-height:64vh;margin:10px auto 0}
.screen{fill:none;stroke:var(--screen);stroke-width:11;stroke-linecap:round}
.scr-label{font-family:var(--body);font-size:30px;fill:var(--muted);text-anchor:middle}
.band{fill:var(--band)}
.rowlabel{font-family:var(--body);font-weight:700;font-size:28px;fill:var(--accent);text-anchor:end;dominant-baseline:central}
.s{fill:var(--seat)}
.s.r{fill:var(--seat-row)}
.s.m{fill:transparent;stroke:var(--accent);stroke-width:3.4;cursor:pointer;animation:lit .5s ease-out both;animation-delay:var(--d,0ms)}
.s.m.f{fill:var(--accent)}
.s.m.y{fill:var(--ink);stroke:var(--ink)}
.s.m.sel{stroke:var(--ink);stroke-width:5}
@keyframes lit{from{opacity:0}to{opacity:1}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.sw{display:inline-block;width:15px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.sw.full{background:var(--accent)}
.sw.open{border:2px solid var(--accent)}
.sw.you{background:var(--ink)}

/* ---------- close-up ---------- */
.seatrow{display:flex;align-items:flex-start;justify-content:center;gap:4px;margin:18px 0 2px}
.chair,.ghost{flex:1 1 0;min-width:0;max-width:58px;display:flex;flex-direction:column;align-items:center}
.chair{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.back{position:relative;width:100%;aspect-ratio:1/1.08;border:2.5px solid var(--accent);border-radius:10px 10px 4px 4px;display:flex;align-items:center;justify-content:center;font-family:var(--body);font-weight:700;font-size:clamp(13px,3.4vw,18px);color:var(--accent);transition:background-color .15s ease,color .15s ease}
.back::after{content:"";position:absolute;left:14%;right:14%;bottom:-7px;height:3px;border-radius:2px;background:var(--accent);opacity:.5}
.chair.filled .back{background:var(--accent);color:var(--on-accent)}
.chair.you .back{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chair.you .back::after{background:var(--ink)}
.chair.sel .back{box-shadow:0 0 0 2.5px var(--surface),0 0 0 5px var(--ink)}
.chair.from .back{border-style:dashed;opacity:.6}
.moving .chair:not(.filled) .back{background:var(--band)}
.who{display:block;width:calc(200% + 4px);flex:none;margin-top:12px;font-size:12px;line-height:1.15;text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chair.lo .who{margin-top:29px}
.chair.filled .who{color:var(--ink);font-weight:600}
.ghost{opacity:.45}
.ghost .who{width:100%}
.ghost .back{border-color:var(--muted);color:var(--muted);border-style:dashed}
.ghost .back::after{background:var(--muted)}
.aisle{flex:0 0 auto;align-self:stretch;writing-mode:vertical-rl;font-size:11px;color:var(--muted);border-left:1.5px dashed var(--line);padding-left:4px;margin-left:4px;max-height:64px;text-align:center}

.editor{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;min-height:58px}
.ed-hint{margin:6px 0;color:var(--muted);font-size:14px}
.ed-hint.strong{color:var(--ink);font-weight:500}
.ed-row{display:flex;align-items:center;gap:12px}
.ed-seat{font-family:var(--body);font-weight:700;font-size:24px;line-height:1;min-width:52px;color:var(--accent)}
.ed-name{font-size:18px;font-weight:600}
.ed-name.open,.ed-status{font-size:16px;color:var(--muted);font-weight:400}
.ed-status.you{color:var(--ink);font-weight:600}
.ed-q{margin:8px 0 0;font-size:16px}
.ed-form{display:flex;gap:8px;margin-top:10px}
.ed-input{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.ed-input:focus{outline:none;border-color:var(--accent)}
.ed-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ed-meta{margin:8px 0 0;font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btnq{display:inline-flex;align-items:center;justify-content:center;background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:9.5px 16px;font-weight:500;font-size:15px;cursor:pointer;text-decoration:none}
.btnq:hover{border-color:var(--accent)}
.btn:disabled,.btnq:disabled,.ed-input:disabled,.qty-b:disabled{opacity:.5;cursor:default}

/* ---------- pay ---------- */
.price{display:flex;align-items:baseline;gap:8px;margin:10px 0 0}
.price-n{font-family:var(--display);font-weight:var(--dweight);letter-spacing:var(--dtrack);font-size:clamp(34px,8vw,44px);line-height:1;color:var(--accent)}
:root[data-film="dune"] .price-n{font-size:clamp(26px,6vw,34px)}
.price-u{color:var(--muted)}
.qty{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.qty-l{font-weight:500}
.qty-b{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:20px;line-height:1;cursor:pointer}
.qty-n{min-width:22px;text-align:center;font-weight:700;font-size:18px}
.qty-t{margin-left:auto;color:var(--muted)}
.qty-t strong{color:var(--ink);font-size:18px}
.paybtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.paybtns > *{flex:1 1 180px}
.handles{display:flex;flex-wrap:wrap;gap:4px 18px;margin:14px 0 0;font-size:14px;color:var(--muted)}
.qr{margin-top:12px}
.qr summary,.prev summary{cursor:pointer;color:var(--muted);font-size:14px}
.qr-grid{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.qr-grid figure{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.qr-grid svg{display:block;width:148px;height:148px;border-radius:10px;border:1px solid var(--line)}

/* ---------- roster, details, share ---------- */
.roster{margin-top:30px}
.ro-note{margin:8px 0 0;font-size:14px;color:var(--muted)}
.lines{list-style:none;margin:14px 0 0;padding:0 0 0 14px;border-left:4px solid var(--accent)}
.seatline{border-bottom:1px solid var(--line);transition:background-color .2s ease}
.seatline:last-child{border-bottom:0}
.seatline.sel{background:var(--band)}
.sl-btn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:3px 6px 3px 0;margin:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.sl-btn:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.sl-num{flex:0 0 46px;font-weight:600;font-size:17px;color:var(--accent);padding-left:4px}
.sl-name{padding:8px 10px;font-weight:500}
.sl-name.open{color:var(--muted);font-weight:400}
.you-tag{margin-left:auto;font-size:12px;font-weight:600;line-height:1.4;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:1px 9px}
.details,.share{margin-top:34px;border-top:1px solid var(--line);padding-top:20px}
.venue{margin:10px 0 2px;font-weight:600;font-size:17px}
.addr{margin:0}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

function dayLabel(m){ const t = when(m); return DAYS[t.getDay()] + ", " + MONTHS[t.getMonth()] + " " + t.getDate(); }
function timeLabel(m){ const t = when(m); let h = t.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + String(t.getMinutes()).padStart(2, "0") + " " + ap; }
function isPast(m){ return when(m).getTime() + 4 * 3600e3 < Date.now(); }
function amount(n){ return Math.round(n * 100) % 100 ? n.toFixed(2) : String(Math.round(n)); }
function money(n){ return "$" + amount(n); }
function themeOf(m){ return m && THEMES.indexOf(m.theme) !== -1 ? m.theme : "classic"; }
function seatIds(m){ return m.seats.map(n => m.row + n); }
function hasSeat(m, s){ return seatIds(m).indexOf(s) !== -1; }
function info(m, s){ return (seats[m.id] && seats[m.id][s]) || null; }
function nm(m, s){ const i = info(m, s); return i ? i.name : ""; }
function mine(m, s){ const i = info(m, s); return !!(i && i.mine); }
function short(n){ if (!n) return ""; const w = n.trim().split(/\s+/)[0]; return w.length > 10 ? w.slice(0, 9) + "\u2026" : w; }
function withParam(u, k, v){ return u + (u.indexOf("?") === -1 ? "?" : "&") + k + "=" + encodeURIComponent(v); }
function current(){ return route.view === "movie" ? MOVIES.find(x => x.id === route.id) || null : null; }
function typing(){ const a = document.activeElement; return !!(a && a.id === "ed-in"); }

/* ---------- data ---------- */
function normalizeMovie(m){
  if (!m || !m.id || !m.title || !m.date || !m.row || !Array.isArray(m.seats) || !m.map) return null;
  const out = Object.assign({}, m);
  out.id = String(m.id).toLowerCase();
  out.row = String(m.row).toUpperCase();
  out.price = Number(m.price) || 0;
  out.theater = m.theater || {};
  return out;
}

async function loadMovies(){
  try {
    const res = await fetch(withParam(MOVIES_URL, "v", Date.now()), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    MOVIES = (data.movies || []).map(normalizeMovie).filter(Boolean);
    moviesStatus = "ok";
  } catch(e) {
    moviesStatus = "error";
  }
}

function applyList(list){
  seats = {};
  for (const m of MOVIES) seats[m.id] = {};
  for (const s of (list || [])) {
    const m = MOVIES.find(x => x.id === String(s.film || "").toLowerCase());
    const id = String(s.seat || "").toUpperCase();
    const name = String(s.name || "").trim().slice(0, 30);
    if (m && name && hasSeat(m, id)) seats[m.id][id] = { name: name, mine: !!s.mine };
  }
  const m = current();
  if (moveFrom && (!m || !mine(m, moveFrom))) moveFrom = null;
}

function parseCSV(t){
  const rows = []; let row = [], fld = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { fld += '"'; i++; } else q = false; } else fld += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(fld); fld = ""; }
    else if (c === "\n") { row.push(fld); rows.push(row); row = []; fld = ""; }
    else if (c !== "\r") fld += c;
  }
  if (fld !== "" || row.length) { row.push(fld); rows.push(row); }
  return rows;
}
function csvToList(text){
  const out = [];
  for (const r of parseCSV(text)) {
    if (r.length < 3) continue;
    const cell = String(r[0] || "").trim().toLowerCase();
    const m = MOVIES.find(x => x.id === cell || x.title.toLowerCase() === cell) ||
      MOVIES.find(x => cell && (x.id.indexOf(cell) === 0 || x.title.toLowerCase().indexOf(cell) !== -1));
    if (!m) continue;
    let seat = String(r[1] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (/^\d+$/.test(seat)) seat = m.row + seat;
    out.push({ film: m.id, seat: seat, name: r[2], mine: false });
  }
  return out;
}

async function loadSeats(){
  if (MODE === "none") return;
  lastLoad = Date.now();
  try {
    if (MODE === "api") {
      const res = await fetch(withParam(withParam(API, "token", TOKEN), "t", Date.now()), { cache: "no-store" });
      const data = await res.json();
      if (!data || !data.ok) throw new Error("bad");
      applyList(data.seats);
    } else {
      let u = CSV;
      if (!/^https?:/i.test(u)) u = withParam(u, "v", Date.now());
      const res = await fetch(u, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (/^\s*</.test(text)) throw new Error("Not CSV");
      applyList(csvToList(text));
    }
    seatStatus = "ok";
  } catch(e) {
    seatStatus = "error";
  }
  if (!typing()) render();
}

async function send(payload, okMsg){
  const m = current();
  if (busy || MODE !== "api" || !m) return false;
  busy = true; renderEditor();
  let ok = false;
  try {
    const res = await fetch(API, { method: "POST", body: JSON.stringify(Object.assign({ token: TOKEN, film: m.id }, payload)) });
    const data = await res.json();
    if (data && data.seats) { applyList(data.seats); seatStatus = "ok"; lastLoad = Date.now(); }
    if (data && data.ok) { ok = true; if (okMsg) toast(okMsg); }
    else toast((data && data.message) || "That didn\u2019t go through. Try again.");
  } catch(e) {
    toast("Couldn\u2019t reach the seat list. Check your connection and try again.");
  }
  busy = false;
  render();
  return ok;
}

/* ---------- art (original motifs, one per theme) ---------- */
function art(theme, kind, uid){
  const id = kind + "-" + String(uid || "x").replace(/[^a-z0-9]/gi, "");
  const open = '<svg class="art art-' + theme + '" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">';
  if (theme === "dune") {
    return open +
      '<defs><linearGradient id="sky-' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--art1)"/><stop offset="1" stop-color="var(--art2)"/></linearGradient>' +
      '<radialGradient id="sun-' + id + '"><stop offset="0" stop-color="var(--art3)"/><stop offset=".55" stop-color="var(--art3)" stop-opacity=".9"/><stop offset="1" stop-color="var(--art3)" stop-opacity="0"/></radialGradient></defs>' +
      '<rect width="1200" height="400" fill="url(#sky-' + id + ')"/>' +
      '<circle cx="790" cy="262" r="170" fill="url(#sun-' + id + ')" opacity=".55"/>' +
      '<circle cx="790" cy="262" r="92" fill="var(--art3)"/>' +
      '<path d="M0 268 C 190 226 370 300 560 258 S 920 214 1200 252 V400 H0Z" fill="var(--art4)"/>' +
      '<path d="M0 312 C 170 280 350 334 540 300 S 880 268 1200 318 V400 H0Z" fill="var(--art5)"/>' +
      '<path d="M0 352 C 230 322 430 376 650 348 S 1000 330 1200 362 V400 H0Z" fill="var(--art6)"/>' +
      '<path d="M120 300 C 300 286 380 318 520 304" fill="none" stroke="var(--art3)" stroke-opacity=".35" stroke-width="2"/>' +
      '<path d="M700 330 C 820 318 930 336 1080 326" fill="none" stroke="var(--art3)" stroke-opacity=".3" stroke-width="2"/>' +
      '</svg>';
  }
  if (theme === "doom") {
    const arch = (cx, w, top, op) => {
      const l = cx - w / 2, r = cx + w / 2, spring = top + w * 0.95;
      return '<g opacity="' + op + '"><path d="M' + l + ' 400 V' + spring + ' Q' + l + ' ' + (top + w * 0.25) + ' ' + cx + ' ' + top + ' Q' + r + ' ' + (top + w * 0.25) + ' ' + r + ' ' + spring + ' V400Z" fill="url(#glow-' + id + ')" stroke="var(--art3)" stroke-width="4"/>' +
        '<path d="M' + cx + ' ' + (top + 18) + ' V400 M' + (l + 6) + ' ' + (spring + 40) + ' H' + (r - 6) + '" stroke="var(--art3)" stroke-width="3" opacity=".7"/></g>';
    };
    let rivets = "";
    for (let x = 30; x < 1200; x += 60) rivets += '<circle cx="' + x + '" cy="22" r="4"/><circle cx="' + x + '" cy="378" r="4"/>';
    return open +
      '<defs><radialGradient id="mist-' + id + '" cx=".5" cy=".75" r=".6"><stop offset="0" stop-color="var(--art2)" stop-opacity=".75"/><stop offset="1" stop-color="var(--art2)" stop-opacity="0"/></radialGradient>' +
      '<linearGradient id="glow-' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--art2)" stop-opacity=".95"/><stop offset="1" stop-color="var(--art2)" stop-opacity=".15"/></linearGradient></defs>' +
      '<rect width="1200" height="400" fill="var(--art1)"/>' +
      '<rect width="1200" height="400" fill="url(#mist-' + id + ')"/>' +
      arch(330, 120, 150, .45) + arch(870, 120, 150, .45) + arch(600, 190, 60, 1) +
      '<g fill="var(--art4)">' + rivets + '</g>' +
      '<rect y="0" width="1200" height="44" fill="var(--art1)" opacity=".35"/>' +
      '</svg>';
  }
  let bulbs = "";
  for (let x = 30; x < 1200; x += 56) bulbs += '<circle cx="' + x + '" cy="30" r="9"/><circle cx="' + (x + 28) + '" cy="370" r="9"/>';
  return open +
    '<defs><linearGradient id="fold-' + id + '" x1="0" y1="0" x2="80" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="var(--art2)"/><stop offset=".5" stop-color="var(--art4)"/><stop offset="1" stop-color="var(--art2)"/></linearGradient>' +
    '<radialGradient id="spot-' + id + '" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="var(--art3)" stop-opacity=".28"/><stop offset="1" stop-color="var(--art3)" stop-opacity="0"/></radialGradient></defs>' +
    '<rect width="1200" height="400" fill="var(--art1)"/>' +
    '<rect x="0" y="60" width="1200" height="280" fill="url(#fold-' + id + ')" opacity=".9"/>' +
    '<rect width="1200" height="400" fill="url(#spot-' + id + ')"/>' +
    '<rect x="0" y="0" width="1200" height="60" fill="var(--art1)"/><rect x="0" y="340" width="1200" height="60" fill="var(--art1)"/>' +
    '<g fill="var(--art3)" class="bulbs">' + bulbs + '</g>' +
    '</svg>';
}

/* ---------- movie page ---------- */
function mapSVG(m){
  const mp = m.map, p = mp.pitch, vb = mp.viewBox, sc = mp.screen;
  const w = +(p * 0.74).toFixed(2), h = +(p * 0.62).toFixed(2), rx = +(p * 0.16).toFixed(2);
  const cx = (sc[0] + sc[1]) / 2, cy = 2 * sc[3] - sc[2];
  let out = '<svg viewBox="' + vb.join(" ") + '" aria-hidden="true" focusable="false">';
  out += '<path class="screen" d="M' + sc[0] + ' ' + sc[2] + ' Q' + cx + ' ' + cy + ' ' + sc[1] + ' ' + sc[2] + '"/>';
  out += '<text class="scr-label" x="' + cx + '" y="' + (sc[3] + 44) + '">Screen</text>';
  let k = 0;
  for (const r of mp.rows) {
    const xs = r.points ? r.points.slice() : r.segments.flatMap(seg => Array.from({ length: seg[1] }, (_, i) => seg[0] + i * p));
    if (r.ours) {
      out += '<rect class="band" x="' + vb[0] + '" y="' + (r.y - p * 0.66).toFixed(1) + '" width="' + vb[2] + '" height="' + (p * 1.32).toFixed(1) + '" rx="' + (p * 0.5).toFixed(1) + '"/>';
      out += '<text class="rowlabel" x="' + (xs[0] - p * 0.9).toFixed(1) + '" y="' + r.y + '">Row ' + esc(m.row) + '</text>';
    }
    xs.forEach((x, i) => {
      const geo = ' x="' + (x - w / 2).toFixed(1) + '" y="' + (r.y - h / 2).toFixed(1) + '" width="' + w + '" height="' + h + '" rx="' + rx + '"/>';
      if (r.ours) {
        const num = mp.numbering === "rtl" ? xs.length - i : i + 1;
        if (m.seats.indexOf(num) !== -1) {
          const s = m.row + num;
          out += '<rect class="s m' + (nm(m, s) ? ' f' : '') + (mine(m, s) ? ' y' : '') + (selected === s ? ' sel' : '') + '" data-act="pick" data-seat="' + s + '" style="--d:' + (k++ * 45) + 'ms"' + geo;
          return;
        }
        out += '<rect class="s r"' + geo;
      } else out += '<rect class="s"' + geo;
    });
  }
  return out + '</svg>';
}

  }

  if (moveFrom) {

      '<div class="ed-actions"><button type="button" class="btn" data-act="domove"' + dis + '>' + label('Move here') + '</button>' +
      '<button type="button" class="btnq" data-act="cancelmove"' + dis + '>Cancel</button></div>';
  }

  if (!selected || !hasSeat(m, selected)) {
    return '<p class="ed-hint">' + (seatStatus === "error" ? 'The seat list didn\u2019t load. Refresh the page to try again.' : 'Tap an open seat to claim it.') + '</p>';
  }

  const name = nm(m, selected);
  if (!name) {
    return seatHead(selected, '<span class="ed-status">Open</span>') +
      '<div class="ed-form"><input id="ed-in" class="ed-input" type="text" value="' + esc(myName) + '" placeholder="Your name" maxlength="30" autocomplete="name" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Name for seat ' + selected + '"' + dis + '>' +

      '<button type="button" class="btn" data-act="rename"' + dis + '>' + label('Save name') + '</button></div>' +

      (m.price ? '<button type="button" class="btnq" data-act="topay"' + dis + '>Pay ' + money(m.price) + '</button>' : '') + '</div>';

  return seatHead(selected, '<span class="ed-name">' + esc(name) + '</span>') +

function qtyFor(m){
  const max = m.seats.length;
  const held = seatIds(m).filter(s => mine(m, s)).length;
  const n = qty[m.id] != null ? qty[m.id] : Math.max(1, held);
  return Math.min(Math.max(1, n), max);
}

function payHTML(m){
  if (!m.price && !VENMO && !CASHTAG) return "";
  const n = qtyFor(m), total = m.price * n;
  const held = seatIds(m).filter(s => mine(m, s));
  const note = m.title + ", " + n + (n === 1 ? " ticket" : " tickets") + (held.length ? " (" + held.join(", ") + ")" : "");
  const amt = total ? amount(total) : "";
  const venmoUrl = "https://venmo.com/" + encodeURIComponent(VENMO) + "?txn=pay" + (amt ? "&amount=" + amt : "") + "&note=" + encodeURIComponent(note);
  const cashUrl = "https://cash.app/$" + encodeURIComponent(CASHTAG) + (amt ? "/" + amt : "");
  const totalTxt = total ? " " + money(total) : "";
  let s = '<section class="card pay" id="pay" aria-labelledby="pay-h"><div class="sec-head"><h2 id="pay-h">Pay for tickets</h2></div>';
  if (m.price) {
    s += '<p class="price"><span class="price-n">' + money(m.price) + '</span><span class="price-u">per ticket</span></p>' +
      '<div class="qty" role="group" aria-label="Number of tickets"><span class="qty-l">Tickets</span>' +
      '<button type="button" class="qty-b" data-act="qty" data-d="-1" aria-label="One fewer ticket"' + (n <= 1 ? ' disabled' : '') + '>\u2212</button>' +
      '<span class="qty-n" aria-live="polite">' + n + '</span>' +
      '<button type="button" class="qty-b" data-act="qty" data-d="1" aria-label="One more ticket"' + (n >= m.seats.length ? ' disabled' : '') + '>+</button>' +
      '<span class="qty-t">Total <strong>' + money(total) + '</strong></span></div>';
  }
  s += '<div class="paybtns">' +
    (VENMO ? '<a class="btn" href="' + esc(venmoUrl) + '" target="_blank" rel="noopener">Pay' + totalTxt + ' with Venmo</a>' : '') +
    (CASHTAG ? '<a class="btnq" href="' + esc(cashUrl) + '" target="_blank" rel="noopener">Pay' + totalTxt + ' with Cash App</a>' : '') + '</div>';
  s += '<p class="handles">' +
    (VENMO ? '<span>Venmo <button type="button" class="handle" data-act="copy" data-text="@' + esc(VENMO) + '">@' + esc(VENMO) + '</button></span>' : '') +
    (CASHTAG ? '<span>Cash App <button type="button" class="handle" data-act="copy" data-text="$' + esc(CASHTAG) + '">$' + esc(CASHTAG) + '</button></span>' : '') + '</p>' +
    '<p class="ed-meta">' + (VENMO ? 'Venmo fills in a note for you. ' : '') + (CASHTAG ? 'On Cash App, add your name and seat to the note.' : '') + '</p>';
  if (QR && (QR.venmo || QR.cash)) {
    s += '<details class="qr" id="qr"><summary>On a computer? Scan to pay</summary><div class="qr-grid">' +
      (VENMO && QR.venmo ? '<figure>' + QR.venmo + '<figcaption>Venmo</figcaption></figure>' : '') +
      (CASHTAG && QR.cash ? '<figure>' + QR.cash + '<figcaption>Cash App</figcaption></figure>' : '') + '</div></details>';
  }
  return s + '</section>';
}

function rosterHTML(m){
  const total = m.seats.length, taken = seatIds(m).filter(s => nm(m, s)).length;
  let s = '<section class="roster" aria-labelledby="ro-h"><div class="sec-head"><h2 id="ro-h">Who sits where</h2><p>' +
    (seatStatus === "loading" ? 'Loading seats\u2026' : taken + ' of ' + total + ' taken') + '</p></div>';
  if (seatStatus === "error") s += '<p class="ro-note">The seat list didn\u2019t load. Refresh the page to try again.</p>';
  else if (MODE === "api") s += '<p class="ro-note">Tap any open seat to claim it. This phone can move or give up the seats it picks.</p>';
  s += '<ul class="lines">' + m.seats.map(num => {
    const seat = m.row + num, name = nm(m, seat), you = mine(m, seat);
    return '<li class="seatline' + (selected === seat ? ' sel' : '') + '" data-row="' + seat + '"><button type="button" class="sl-btn" data-act="pick" data-seat="' + seat + '" data-scroll="1">' +
      '<span class="sl-num">' + seat + '</span><span class="sl-name' + (name ? '' : ' open') + '">' + (name ? esc(name) : 'Open') + '</span>' +
      (you ? '<span class="you-tag">You</span>' : '') + '</button></li>';
  }).join("") + '</ul></section>';
  return s;
}

function detailsHTML(m){
  const t = m.theater;
  return '<section class="details" aria-labelledby="where-h"><h2 id="where-h">Where</h2>' +
    '<p class="venue">' + esc(t.name || "") + '</p>' +
    '<p class="addr">' + esc(t.address1 || "") + (t.address2 ? '<br>' + esc(t.address2) : '') + (m.auditorium ? '<br>' + esc(m.auditorium) : '') + '</p>' +
    '<div class="links">' + (t.maps ? '<a class="lnk" href="' + esc(t.maps) + '" target="_blank" rel="noopener">Directions</a>' : '') +
    (t.phone ? '<a class="lnk" href="tel:' + String(t.phone).replace(/\D/g, "") + '">Call ' + esc(t.phone) + '</a>' : '') + '</div></section>';
}

function listText(m){
  const t = m.theater;
  const L = [m.title + (m.format ? " (" + m.format + ")" : ""), dayLabel(m) + " at " + timeLabel(m), (t.name || "") + (m.auditorium ? ", " + m.auditorium : ""), [t.address1, t.address2].filter(Boolean).join(", ")];
  if (m.price) L.push("Tickets are " + money(m.price) + (VENMO ? ". Venmo @" + VENMO : "") + (CASHTAG ? (VENMO ? " or" : ".") + " Cash App $" + CASHTAG : "") + ".");
  L.push("", "Row " + m.row + ", left to right as you face the screen:");
  for (const num of m.seats) { const s = m.row + num; L.push(s + "  " + (nm(m, s) || "open")); }
  return L.join("\n");
}

function shareHTML(m){
  return '<section class="share" aria-labelledby="share-h"><h2 id="share-h">Send the seat list</h2>' +
    '<p>Copies the showtime, the theater, the ticket price, and who\u2019s in each seat, ready to paste into a group text.</p>' +
    '<button type="button" class="btn" data-act="copylist">Copy seat list</button>' +
    '<details class="prev" id="prev"><summary>Preview the text</summary><textarea id="listprev" readonly rows="' + (m.seats.length + 9) + '">' + esc(listText(m)) + '</textarea></details></section>';
}

function movieHTML(m){
  const theme = themeOf(m);
  return '<main class="wrap movie"><header class="mhero"><div class="hero-art">' + art(theme, "hero", m.id) + '</div>' +
    '<a class="crumb" href="#/">\u2190 Upcoming</a>' +
    '<h1 class="title">' + esc(m.title) + '</h1>' +
    '<div class="when"><span>' + dayLabel(m) + '</span><span class="time">' + timeLabel(m) + '</span></div>' +
    '<p class="sub">' + (m.format ? esc(m.format) + ' at ' : '') + esc(m.theater.name || "") + '</p>' +
    (m.note ? '<p class="note">' + esc(m.note) + '</p>' : '') +
    (isPast(m) ? '<p class="note">This showing has passed.</p>' : '') + '</header>' +
    '<div class="grid"><div class="col-a">' + mapHTML(m) + closeHTML(m) + '</div>' +
    '<div class="col-b">' + payHTML(m) + rosterHTML(m) + detailsHTML(m) + shareHTML(m) + '</div></div></main>';
}

function notFoundHTML(){
  return '<main class="wrap"><header class="mhero"><a class="crumb" href="#/">\u2190 Upcoming</a><h1 class="title">Not found</h1>' +
    '<p class="sub">That movie night isn\u2019t on the list. It may have been renamed or removed.</p></header></main>';
}

/* ---------- render ---------- */
function render(){
  const m = current();
  const open = {};
  ["prev", "qr"].forEach(id => { const d = document.getElementById(id); open[id] = !!(d && d.open); });
  document.documentElement.setAttribute("data-film", m ? themeOf(m) : "classic");
  document.title = m ? m.title + " | " + SITE : SITE;
  brandEl.textContent = SITE;
  sideEl.innerHTML = sideHTML(m);
  viewEl.className = moveFrom ? "moving" : "";
  if (route.view === "movie" && !m && moviesStatus === "ok") viewEl.innerHTML = notFoundHTML();
  else viewEl.innerHTML = m ? movieHTML(m) : homeHTML();
  ["prev", "qr"].forEach(id => { const d = document.getElementById(id); if (d && open[id]) d.open = true; });
}

function renderEditor(){
  const m = current(), ed = document.getElementById("editor");
  if (m && ed) ed.innerHTML = editorHTML(m);
}

function renderPay(){
  const m = current(), p = document.getElementById("pay");
  if (!m || !p) return;
  const qrOpen = !!(document.getElementById("qr") || {}).open;
  p.outerHTML = payHTML(m);
  const q = document.getElementById("qr");
  if (q && qrOpen) q.open = true;
}

function parseRoute(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, "")).toLowerCase().replace(/\/+$/, "");
  return h ? { view: "movie", id: h } : { view: "home" };
}

/* ---------- interaction ---------- */
let toastTimer = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2800);
}
function legacyCopy(t){
  try {
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch(e){ return false; }
}
async function copy(t){
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch(e){}
  return legacyCopy(t);
}
async function copyList(){
  const m = current(); if (!m) return;
  if (await copy(listText(m))) { toast("Seat list copied"); return; }
  const d = document.getElementById("prev"), ta = document.getElementById("listprev");
  if (d) d.open = true;
  if (ta) { ta.focus(); ta.select(); }
  toast("Select the text below to copy it");
}

function updateSel(){
  viewEl.querySelectorAll(".sel").forEach(el => el.classList.remove("sel"));
  if (selected) viewEl.querySelectorAll('.chair[data-seat="' + selected + '"], rect[data-seat="' + selected + '"], li[data-row="' + selected + '"]').forEach(el => el.classList.add("sel"));
  renderEditor();
}

function pick(seat, fromRoster){
  const m = current();
  if (!m || !hasSeat(m, seat) || busy) return;
  selected = (selected === seat && !moveFrom) ? null : seat;
  updateSel();
  if (fromRoster) {
    const ed = document.getElementById("editor");
    if (ed) ed.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
  }
  if (MODE === "api" && selected && !moveFrom && !nm(m, selected) && !myName) {
    const i = document.getElementById("ed-in");
    if (i) i.focus({ preventScroll: !!fromRoster });
  }
}

async function claim(){
  const i = document.getElementById("ed-in");
  const name = i ? i.value.trim().slice(0, 30) : "";
  if (!name) { toast("Type a name first"); if (i) i.focus(); return; }
  const seat = selected;
  if (i) i.blur();
  if (!myName) { myName = name; lsSet(NAME_KEY, name); }
  await send({ action: "claim", seat: seat, name: name }, name + " is in " + seat);
}
async function rename(){
  const i = document.getElementById("ed-in");
  const name = i ? i.value.trim().slice(0, 30) : "";
  if (!name) { toast("Type a name, or use Give up seat"); return; }
  if (i) i.blur();
  await send({ action: "claim", seat: selected, name: name }, "Name saved");
}
async function release(){
  const m = current(), seat = selected, name = nm(m, seat);
  if (!window.confirm("Give up " + seat + (name ? " (" + name + ")" : "") + "? Someone else can take it.")) return;
  await send({ action: "release", seat: seat }, seat + " is open again");
}
async function doMove(){
  const from = moveFrom, to = selected;
  const ok = await send({ action: "move", from: from, seat: to }, "Moved to " + to);
  if (ok) { moveFrom = null; render(); }
}

function setNav(open){
  appEl.classList.toggle("nav-open", open);
  const btn = document.getElementById("menu-btn");
  if (btn) btn.setAttribute("aria-expanded", String(open));
  if (open) { const a = sideEl.querySelector("a"); if (a) a.focus({ preventScroll: true }); }
}

appEl.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const act = t.getAttribute("data-act");
  if (act === "opennav") setNav(true);
  else if (act === "closenav") setNav(false);
  else if (act === "pick") pick(t.getAttribute("data-seat"), t.hasAttribute("data-scroll"));
  else if (act === "claim") claim();
  else if (act === "rename") rename();
  else if (act === "release") release();
  else if (act === "move") { moveFrom = selected; selected = null; render(); }
  else if (act === "cancelmove") { selected = moveFrom; moveFrom = null; render(); }
  else if (act === "domove") doMove();
  else if (act === "copylist") copyList();
  else if (act === "copy") { const c = t.getAttribute("data-text"); toast((await copy(c)) ? "Copied " + c : "Couldn\u2019t copy. It\u2019s " + c); }
  else if (act === "qty") {
    const m = current(); if (!m) return;
    qty[m.id] = Math.min(Math.max(1, qtyFor(m) + Number(t.getAttribute("data-d"))), m.seats.length);
    renderPay();
  }
  else if (act === "topay") {
    const p = document.getElementById("pay");
    if (p) p.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  }
});

appEl.addEventListener("keydown", e => {
  if (e.key === "Escape" && appEl.classList.contains("nav-open")) { setNav(false); return; }
  if (e.key !== "Enter" || !e.target || e.target.id !== "ed-in") return;
  e.preventDefault();
  const m = current();
  if (m && nm(m, selected) && mine(m, selected)) rename(); else claim();
});

window.addEventListener("hashchange", () => {
  route = parseRoute(); selected = null; moveFrom = null;
  setNav(false);
  render();
  try { window.scrollTo(0, 0); } catch(err){}
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && MODE !== "none" && !busy && Date.now() - lastLoad > 15000) loadSeats();
});
setInterval(() => {
  if (MODE === "api" && document.visibilityState === "visible" && !busy && !typing() && Date.now() - lastLoad > 30000) loadSeats();
}, 5000);

/* ---------- start ---------- */
route = parseRoute();
render();
loadMovies().then(() => { applyList([]); render(); return loadSeats(); });
})();

</script>
</body>
</html>
